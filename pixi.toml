[workspace]
channels = ["https://repo.prefix.dev/modular-community", "https://conda.modular.com/max", "conda-forge"]
name = "Mojogram"
platforms = ["linux-64"]
version = "0.0.1"
preview = ["pixi-build"]

[tasks]

[dependencies]
mojo = ">=1.1.0,<2"
floki = { git = "https://github.com/thatstoasty/floki.git", tag = "v0.4.1" }

[package]
name = "mojogram"
version = "0.1.0"

[package.build]
backend = { name = "pixi-build-mojo", version = ">=0.2.6,<0.4" }

[package.build.config.pkg]
name = "mojogram"
path = "mojogram"

[package.host-dependencies]
mojo-compiler = "=1.1.0"

[package.build-dependencies]
mojo-compiler = "=1.1.0"
floki = { git = "https://github.com/thatstoasty/floki.git", tag = "v0.4.1" }

[package.run-dependencies]
mojo-compiler = "=1.1.0"
floki = { git = "https://github.com/thatstoasty/floki.git", tag = "v0.4.1" }